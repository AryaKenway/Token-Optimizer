<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codegraph · __CODEGRAPH_TITLE__</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --text: #1b1f24; --muted: #5d6673; --faint: #8b94a1;
  --border: #dde1e6; --accent: #3b6fe0; --accent-soft: rgba(59,111,224,.12); --edge: rgba(60,70,90,.16);
  --edge-hi: rgba(59,111,224,.85); --edge-in: rgba(214,120,30,.85); --label: #1b1f24; --label-halo: rgba(246,247,249,.9);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #161a20; --panel-2: #1d222a; --text: #e5e9ee; --muted: #9aa4b1; --faint: #6b7583;
    --border: #2a313b; --accent: #6f9bff; --accent-soft: rgba(111,155,255,.15); --edge: rgba(170,185,210,.13);
    --edge-hi: rgba(111,155,255,.9); --edge-in: rgba(240,160,80,.9); --label: #e5e9ee; --label-halo: rgba(15,18,22,.85);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #161a20; --panel-2: #1d222a; --text: #e5e9ee; --muted: #9aa4b1; --faint: #6b7583;
  --border: #2a313b; --accent: #6f9bff; --accent-soft: rgba(111,155,255,.15); --edge: rgba(170,185,210,.13);
  --edge-hi: rgba(111,155,255,.9); --edge-in: rgba(240,160,80,.9); --label: #e5e9ee; --label-halo: rgba(15,18,22,.85);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { display: grid; grid-template-columns: 290px 1fr 380px; grid-template-rows: 48px 1fr; height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 14px; font-weight: 650; margin: 0; white-space: nowrap; }
header .stats { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.iconbtn { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 7px; padding: 5px 9px; cursor: pointer; font: inherit; }
.iconbtn:hover { color: var(--text); }
aside { background: var(--panel); overflow: auto; min-height: 0; }
#left { border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 14px; }
#right { border-left: 1px solid var(--border); padding: 14px; }
.search { position: relative; }
.search input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); color: var(--text); font: inherit; outline: none; }
.search input:focus { border-color: var(--accent); }
#results { margin-top: 6px; display: flex; flex-direction: column; gap: 1px; max-height: 38vh; overflow: auto; }
.res { padding: 5px 7px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 0 7px; }
.res:hover, .res.sel { background: var(--accent-soft); }
.res .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .pt { grid-column: 2; color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--panel-2); color: var(--muted); align-self: start; margin-top: 1px; border: 1px solid var(--border); }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 6px; font-weight: 650; }
.legend { display: flex; flex-direction: column; gap: 2px; }
.lg { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; user-select: none; }
.lg:hover { background: var(--panel-2); }
.lg.off { opacity: .38; }
.sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lg .n { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.lg .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
.opts input[type=range] { flex: 1; }
#stage { position: relative; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; box-shadow: var(--shadow); max-width: 380px; display: none; font-size: 12px; }
#tip .p { font-family: var(--mono); font-weight: 600; }
#tip .s { color: var(--muted); margin-top: 2px; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--faint); font-size: 11px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
#zoomctl { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 6px; }
.empty { color: var(--faint); padding: 30px 6px; text-align: center; }
.path { font-family: var(--mono); font-size: 13px; font-weight: 650; word-break: break-all; }
.sum { color: var(--muted); margin: 6px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); }
.chip a { color: var(--accent); text-decoration: none; }
.sec { margin: 14px 0; }
.flist { display: flex; flex-direction: column; gap: 1px; }
.fl { font-family: var(--mono); font-size: 12px; padding: 3px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.fl:hover { background: var(--accent-soft); }
.fl .sw { width: 8px; height: 8px; }
.fl span.x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sym { border-radius: 6px; padding: 4px 6px; cursor: pointer; }
.sym:hover { background: var(--panel-2); }
.sym .row { display: flex; gap: 6px; align-items: baseline; }
.sym .nm { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sym .ln { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.sym .doc { color: var(--muted); font-size: 11.5px; margin: 2px 0 0 0; }
.sym .det { margin: 6px 0 2px 6px; padding-left: 8px; border-left: 2px solid var(--border); display: none; }
.sym.open .det { display: block; }
.sym .det .sig { font-family: var(--mono); font-size: 11.5px; color: var(--text); word-break: break-word; margin-bottom: 4px; }
.sym .det .lbl { color: var(--faint); font-size: 11px; margin-top: 4px; }
.ref { font-family: var(--mono); font-size: 11.5px; padding: 1px 0; cursor: pointer; color: var(--accent); }
.ref:hover { text-decoration: underline; }
.indent { margin-left: 14px; }
a.open { color: var(--accent); text-decoration: none; font-size: 12px; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
@media (max-width: 1100px) { #app { grid-template-columns: 250px 1fr 320px; } }
@media (max-width: 820px) {
  body { overflow: auto; }
  #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto auto; height: auto; }
  header { flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
  #left, #right { border: 0; border-top: 1px solid var(--border); padding: 12px 16px; }
  #stage { order: 1; } #left { order: 2; } #right { order: 3; }
}

<body>
<div id="app">
  <header>
    <h1 id="title">Codegraph</h1>
    <div class="stats" id="stats"></div>
    <div class="sp"></div>
    <div class="seg" id="modeSeg"><button data-v="files" class="on">Files</button><button data-v="folders">Folders</button></div>
    <div class="seg" id="colorSeg"><button data-v="folder" class="on">By folder</button><button data-v="lang">By language</button></div>
    <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
  </header>
  <aside id="left">
    <div class="search">
      <input id="q" placeholder="Search files & symbols…  ( / )" autocomplete="off" spellcheck="false">
      <div id="results"></div>
    </div>
    <div>
      <h3>Show</h3>
      <div class="opts">
        <label><input type="checkbox" id="optTests" checked> Tests</label>
        <label><input type="checkbox" id="optDocs"> Docs &amp; config</label>
        <label><input type="checkbox" id="optStyle"> Stylesheets</label>
        <label><input type="checkbox" id="optVendor"> Third-party / vendor</label>
        <label><input type="checkbox" id="optIsolated" checked> Unconnected files</label>
        <label><input type="checkbox" id="optLabels" checked> Labels</label>
        <label title="Only show the selected file and its neighbours"><input type="checkbox" id="optFocus"> Focus on selection</label>
        <label title="Neighbourhood depth for focus mode">Depth <input type="range" id="optDepth" min="1" max="4" value="1"><span id="depthV">1</span></label>
      </div>
    </div>
    <div>
      <h3 id="legendTitle">Folders</h3>
      <div class="legend" id="legend"></div>
    </div>
  </aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="hint">Scroll to zoom · drag to pan · click a node · double-click to focus · <kbd>Esc</kbd> to clear</div>
    <div id="zoomctl"><button class="iconbtn" id="fitBtn" title="Fit to view">Fit</button><button class="iconbtn" id="relayoutBtn" title="Re-run layout">Re-layout</button></div>
  </div>
  <aside id="right"><div class="empty" id="emptyDetail">Select a file or folder to see its symbols, dependencies and line ranges.</div><div id="detail"></div></aside>
</div>
<script id="cg-data" type="application/json">__CODEGRAPH_DATA__</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('cg-data').textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KIND = { function: 'fn', method: 'm', class: 'cls', interface: 'iface', type: 'type', enum: 'enum', const: 'const', struct: 'struct', trait: 'trait', impl: 'impl', module: 'mod', namespace: 'ns', macro: 'macro', object: 'obj', heading: '#', target: 'tgt', script: 'run', route: 'route', table: 'tbl', view: 'view', procedure: 'proc', protocol: 'proto', extension: 'ext' };
const rng = (s) => s.e > s.l ? `L${s.l}–${s.e}` : `L${s.l}`;
const rootUri = (D.root || '').replace(/\\/g, '/');
const vscodeLink = (p, line) => `vscode://file/${encodeURI(rootUri + '/' + p)}${line ? ':' + line : ''}`;

// ── index ──
const files = D.files, syms = D.syms;
syms.forEach((s, i) => { s.id = i; });
const symsByFile = files.map(() => []);
syms.forEach((s) => symsByFile[s.f].push(s));
const outE = files.map(() => new Set()), inE = files.map(() => new Set());
for (const e of D.edges) { outE[e.s].add(e.t); inE[e.t].add(e.s); }
const callers = new Map(), callees = new Map();
for (const [from, file, to, line, count] of D.refs) {
  if (!callers.has(to)) callers.set(to, []); callers.get(to).push({ from, file, line, count });
  if (from >= 0) { if (!callees.has(from)) callees.set(from, []); callees.get(from).push({ to, line, count }); }
}
const dirOf = (p) => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '.';

// group depth: pick the shallowest depth giving 4..14 groups
const groupAt = (p, d) => { const parts = p.split('/'); return parts.length <= 1 ? '(root)' : parts.slice(0, Math.min(d, parts.length - 1)).join('/'); };
let GD = 1;
for (let d = 1; d <= 3; d++) { const n = new Set(files.map((f) => groupAt(f.p, d))).size; GD = d; if (n >= 4) break; }
files.forEach((f) => { f.group = groupAt(f.p, GD); f.folder = dirOf(f.p); });

const PALETTE = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#76b7b2', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#6b8e23', '#17becf', '#d4a017', '#8c564b', '#7f7fff', '#2ca089', '#c45ab3'];
const colorKeys = { folder: [], lang: [] };
const countBy = (fn) => { const m = new Map(); files.forEach((f) => m.set(fn(f), (m.get(fn(f)) || 0) + 1)); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
const groupCounts = countBy((f) => f.group), langCounts = countBy((f) => f.lang);
const colorOf = { folder: new Map(), lang: new Map() };
groupCounts.forEach(([k], i) => colorOf.folder.set(k, i < PALETTE.length ? PALETTE[i] : '#8a8f98'));
langCounts.forEach(([k], i) => colorOf.lang.set(k, i < PALETTE.length ? PALETTE[i] : '#8a8f98'));

// ── state ──
const S = { mode: 'files', color: 'folder', hiddenGroups: new Set(), hiddenLangs: new Set(), selected: null, hover: null,
  tests: true, docs: false, style: false, vendor: false, isolated: true, labels: true, focus: false, depth: 1 };
let nodes = [], links = [], nodeById = new Map();
const view = { x: 0, y: 0, k: 1 };
const posCache = new Map();

function fileVisible(f, i) {
  if (!S.tests && f.cat === 'test') return false;
  if (!S.docs && (f.cat === 'doc' || f.cat === 'config')) return false;
  if (!S.style && f.cat === 'style') return false;
  if (!S.vendor && f.cat === 'vendor') return false;
  if (S.hiddenGroups.has(f.group) && S.color === 'folder') return false;
  if (S.hiddenLangs.has(f.lang) && S.color === 'lang') return false;
  return true;
}

function neighborhood(startIds, adjOut, adjIn, depth) {
  const seen = new Set(startIds); let fr = [...startIds];
  for (let d = 0; d < depth; d++) { const nx = []; for (const n of fr) for (const m of [...(adjOut(n) || []), ...(adjIn(n) || [])]) if (!seen.has(m)) { seen.add(m); nx.push(m); } fr = nx; }
  return seen;
}

function rebuild() {
  // save positions
  for (const n of nodes) posCache.set(n.key, { x: n.x, y: n.y });
  nodes = []; links = []; nodeById = new Map();
  if (S.mode === 'files') {
    const vis = files.map((f, i) => fileVisible(f, i));
    let allowed = null;
    if (S.focus && S.selected && S.selected.type === 'file') allowed = neighborhood([S.selected.id], (n) => outE[n], (n) => inE[n], S.depth);
    files.forEach((f, i) => {
      if (!vis[i] || (allowed && !allowed.has(i))) return;
      const deg = [...outE[i]].filter((j) => vis[j]).length + [...inE[i]].filter((j) => vis[j]).length;
      if (!S.isolated && deg === 0 && !allowed) return;
      const n = { key: 'f' + i, id: i, type: 'file', label: f.p.slice(f.p.lastIndexOf('/') + 1), full: f.p, f, r: 3 + Math.sqrt(Math.max(f.lines, 1)) * 0.28 + Math.sqrt(inE[i].size) * 1.4, group: f.group };
      n.r = Math.min(n.r, 26); nodes.push(n); nodeById.set(n.key, n);
    });
    for (const e of D.edges) { const a = nodeById.get('f' + e.s), b = nodeById.get('f' + e.t); if (a && b) links.push({ source: a, target: b, w: 1 + Math.min(4, e.refs * 0.3) }); }
  } else {
    const fold = new Map();
    files.forEach((f, i) => {
      if (!fileVisible(f, i)) return;
      const k = f.folder;
      if (!fold.has(k)) fold.set(k, { key: 'd' + k, id: k, type: 'folder', label: k === '.' ? './' : k.split('/').pop() + '/', full: k, files: [], lines: 0, group: f.group });
      const d = fold.get(k); d.files.push(i); d.lines += f.lines;
    });
    const agg = new Map();
    for (const e of D.edges) {
      const a = files[e.s], b = files[e.t];
      if (!fold.has(a.folder) || !fold.has(b.folder) || a.folder === b.folder) continue;
      const k = a.folder + '\u0000' + b.folder; agg.set(k, (agg.get(k) || 0) + 1);
    }
    let allowed = null;
    if (S.focus && S.selected && S.selected.type === 'folder') {
      const oa = new Map(), ia = new Map();
      for (const k of agg.keys()) { const [a, b] = k.split('\u0000'); (oa.get(a) || oa.set(a, []).get(a)).push(b); (ia.get(b) || ia.set(b, []).get(b)).push(a); }
      allowed = neighborhood([S.selected.id], (n) => oa.get(n), (n) => ia.get(n), S.depth);
    }
    for (const d of fold.values()) {
      if (allowed && !allowed.has(d.id)) continue;
      d.r = Math.min(34, 5 + Math.sqrt(d.files.length) * 3.2); nodes.push(d); nodeById.set(d.key, d);
    }
    for (const [k, w] of agg) { const [a, b] = k.split('\u0000'); const na = nodeById.get('d' + a), nb = nodeById.get('d' + b); if (na && nb) links.push({ source: na, target: nb, w: Math.min(6, 1 + Math.log2(w)) , count: w }); }
  }
  // adjacency for highlight
  for (const n of nodes) { n.nb = new Set(); n.outs = new Set(); n.ins = new Set(); }
  for (const l of links) { l.source.nb.add(l.target); l.target.nb.add(l.source); l.source.outs.add(l.target); l.target.ins.add(l.source); }
  // initial positions: cached, else clustered by group
  const groups = [...new Set(nodes.map((n) => n.group))];
  const gAngle = new Map(groups.map((g, i) => [g, (i / Math.max(1, groups.length)) * Math.PI * 2]));
  const R0 = 40 + Math.sqrt(nodes.length) * 22;
  for (const n of nodes) {
    const c = posCache.get(n.key);
    if (c) { n.x = c.x; n.y = c.y; }
    else { const a = gAngle.get(n.group) || 0; const rr = R0 * (0.55 + Math.random() * 0.25); n.x = Math.cos(a) * rr + (Math.random() - .5) * R0 * .5; n.y = Math.sin(a) * rr + (Math.random() - .5) * R0 * .5; }
    n.vx = 0; n.vy = 0;
  }
  sim.alpha = posCache.size && nodes.every((n) => posCache.has(n.key)) ? 0.25 : 1;
  renderLegend();
  updateStats();
  kick();
}

// ── force simulation (Barnes–Hut) ──
const sim = { alpha: 1, running: false };
function quadtree(ns) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of ns) { if (n.x < x0) x0 = n.x; if (n.y < y0) y0 = n.y; if (n.x > x1) x1 = n.x; if (n.y > y1) y1 = n.y; }
  const size = Math.max(x1 - x0, y1 - y0, 1) + 1;
  const root = { x0, y0, s: size, m: 0, cx: 0, cy: 0, kids: null, node: null };
  const insert = (q, n, depth) => {
    if (!q.kids && !q.node) { q.node = n; q.m = 1; q.cx = n.x; q.cy = n.y; return; }
    if (!q.kids) {
      if (depth > 40) { q.m++; return; }
      q.kids = [null, null, null, null]; const old = q.node; q.node = null; place(q, old, depth);
    }
    q.cx = (q.cx * q.m + n.x) / (q.m + 1); q.cy = (q.cy * q.m + n.y) / (q.m + 1); q.m++;
    place(q, n, depth);
  };
  const place = (q, n, depth) => {
    const h = q.s / 2, i = (n.x >= q.x0 + h ? 1 : 0) + (n.y >= q.y0 + h ? 2 : 0);
    if (!q.kids[i]) q.kids[i] = { x0: q.x0 + (i & 1 ? h : 0), y0: q.y0 + (i & 2 ? h : 0), s: h, m: 0, cx: 0, cy: 0, kids: null, node: null };
    insert(q.kids[i], n, depth + 1);
  };
  for (const n of ns) insert(root, n, 0);
  return root;
}
function tick() {
  const a = sim.alpha, N = nodes.length;
  if (!N) { sim.alpha = 0; return; }
  const rep = -260 * (S.mode === 'folders' ? 2 : 1);
  const qt = quadtree(nodes);
  for (const n of nodes) {
    const stack = [qt];
    while (stack.length) {
      const q = stack.pop();
      if (!q || !q.m) continue;
      const dx = q.cx - n.x, dy = q.cy - n.y; let d2 = dx * dx + dy * dy;
      if (q.node === n && !q.kids) continue;
      if (!q.kids || (q.s * q.s) / (d2 + 1e-6) < 0.81) {
        if (d2 < 1) d2 = 1;
        if (d2 > 640000) continue;
        const f = (rep * q.m * a) / d2;
        n.vx += dx * f; n.vy += dy * f;
      } else for (const k of q.kids) if (k) stack.push(k);
    }
  }
  const L = S.mode === 'folders' ? 90 : 48;
  for (const l of links) {
    const s = l.source, t = l.target; let dx = t.x - s.x, dy = t.y - s.y; const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const deg = Math.min(s.nb.size, t.nb.size) || 1;

// ── interaction ──
const toWorld = (ex, ey) => { const r = cv.getBoundingClientRect(); return { x: (ex - r.left - W / 2 - view.x) / view.k, y: (ey - r.top - H / 2 - view.y) / view.k }; };

// ── detail panel ──
function fileChip(i) { const f = files[i]; return `<div class="fl" data-file="${i}"><span class="sw" style="background:${S.color === 'folder' ? colorOf.folder.get(f.group) : colorOf.lang.get(f.lang)}"></span><span class="x">${esc(f.p)}</span></div>`; }

    return;
  }
  const i = S.selected.id, f = files[i];
  const sy = symsByFile[i];
  const depth = (s) => { let d = 0, p = s.p; while (p !== undefined) { d++; p = syms[p].p; } return d; };

    const c = (callers.get(s.id) || []).length;

// ── search ──

  const hidden = byLang ? S.hiddenLangs : S.hiddenGroups;
  const cmap = byLang ? colorOf.lang : colorOf.folder;
  $('legend').innerHTML = entries.map(([k, n]) => `<div class="lg${hidden.has(k) ? ' off' : ''}" data-k="${esc(k)}" title="Click to show/hide · Alt-click to show only this"><span class="sw" style="background:${cmap.get(k)}"></span><span class="t">${esc(k)}</span><span class="n">${n}</span></div>`).join('');

$('legend').addEventListener('click', (e) => {

function setMode(m) { S.mode = m; S.selected = null; renderDetail(); document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.v === m)); fitted = false; rebuild(); }
$('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.v); });
$('colorSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.color = b.dataset.v; document.querySelectorAll('#colorSeg button').forEach((x) => x.classList.toggle('on', x === b)); rebuild(); renderDetail(); });
const bindCheck = (id, key, re = true) => $(id).addEventListener('change', (e) => { S[key] = e.target.checked; if (re) rebuild(); else draw(); });
bindCheck('optTests', 'tests'); bindCheck('optDocs', 'docs'); bindCheck('optStyle', 'style'); bindCheck('optVendor', 'vendor'); bindCheck('optIsolated', 'isolated'); bindCheck('optLabels', 'labels', false); bindCheck('optFocus', 'focus');
$('optDepth').addEventListener('input', (e) => { S.depth = +e.target.value; $('depthV').textContent = S.depth; if (S.focus) rebuild(); });
$('fitBtn').addEventListener('click', fit);
$('relayoutBtn').addEventListener('click', () => { posCache.clear(); nodes.forEach((n) => { n.fixed = false; }); nodes = []; fitted = false; rebuild(); });
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  try { localStorage.setItem('cg-theme', document.documentElement.getAttribute('data-theme')); } catch {}
  readColors(); draw();
});
try { const t = localStorage.getItem('cg-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch {}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { readColors(); draw(); });

function updateStats() {
  $('stats').textContent = `${files.length} files · ${syms.length} symbols · ${D.edges.length} dependencies · showing ${nodes.length} nodes · built ${(D.generated || '').slice(0, 16).replace('T', ' ')}`;
}
$('title').textContent = 'Codegraph · ' + D.name;
